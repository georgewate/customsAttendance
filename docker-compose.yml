services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d smart_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      APP_NAME: SmartAttendance
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:10000
      APP_KEY: base64:+IyPCa1oSb5Q3MkR1C7uqGF4uvxzOSSyRnXOTd7vktM=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: smart_attendance
      DB_USERNAME: attendance
      DB_PASSWORD: attendance
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      ADMIN_EMAIL: admin@attendance.local
      ADMIN_PASSWORD: admin123
      PORT: "10000"
    volumes:
      - appdata:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
