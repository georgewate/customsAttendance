databases:
  - name: smart-attendance-db
    plan: free
    databaseName: smart_attendance
    user: attendance
    region: oregon

services:
  - type: web
    name: smart-attendance
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: ADMIN_EMAIL
        value: admin@attendance.local
      - key: ADMIN_PASSWORD
        sync: false
